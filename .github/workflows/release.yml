name: Release

# Publishes a portable DoomsdayClock.exe and attaches it to a GitHub Release
# whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/DoomsdayClock/DoomsdayClock.csproj

      - name: Publish portable single-file exe
        run: >
          dotnet publish src/DoomsdayClock/DoomsdayClock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DoomsdayClock.exe
          generate_release_notes: true
