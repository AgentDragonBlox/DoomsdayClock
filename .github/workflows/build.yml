name: Build

# Every push and pull request: lint, test and build the real Windows exe on a
# Windows runner, and upload it as a downloadable artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build release exe
        run: cargo build --release --locked

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DoomsdayClock-win-x64
          path: target/release/DoomsdayClock.exe
          if-no-files-found: error
